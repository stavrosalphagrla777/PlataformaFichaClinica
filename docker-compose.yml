services:
  app:
    build: ./backend
    container_name: ficha_app
    command: sh -c "composer install --no-interaction --prefer-dist && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: ficha_db
    environment:
      MYSQL_DATABASE: ficha_clinica
      MYSQL_USER: ficha
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: ficha_pma
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

  # Captura los correos de "recuperar contraseña" en desarrollo (http://localhost:8025)
  mailpit:
    image: axllent/mailpit
    container_name: ficha_mail
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
