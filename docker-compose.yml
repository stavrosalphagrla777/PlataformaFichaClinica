name: ${COMPOSE_PROJECT_NAME:-ficha_clinica_entrega}

services:
  app:
    build: ./backend
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "${FICHA_APP_PORT:-8002}:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ficha_clinica
      MYSQL_USER: ficha
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${FICHA_DB_PORT:-3309}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
    ports:
      - "${FICHA_PMA_PORT:-8083}:80"
    depends_on:
      - db

  # Captura los correos de "recuperar contraseña" en desarrollo (http://localhost:8025)
  mailpit:
    image: axllent/mailpit
    ports:
      - "${FICHA_MAIL_PORT:-8027}:8025"
      - "${FICHA_SMTP_PORT:-1027}:1025"

volumes:
  db_data:
